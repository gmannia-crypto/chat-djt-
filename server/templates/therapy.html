<!DOCTYPE html>
<html>
<head>
    <title>Chat DJT Therapy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: white; }
        .container { max-width: 700px; margin: 0 auto; padding: 20px 16px; }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
        .header h1 span { color: #ff4d4d; }

        .persona-selector { display: flex; gap: 12px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
        .persona-card {
            width: 130px; padding: 14px 10px; border-radius: 16px; cursor: pointer;
            background: #141414; border: 2px solid #222; text-align: center;
            transition: all 0.25s ease; position: relative; overflow: hidden;
        }
        .persona-card:hover { transform: translateY(-3px); border-color: #444; }
        .persona-card.active { border-width: 2.5px; transform: translateY(-3px); }
        .persona-card.active[data-persona="trump"] { border-color: #ff4d4d; box-shadow: 0 6px 20px rgba(255,77,77,0.25); }
        .persona-card.active[data-persona="sophia"] { border-color: #e87ba8; box-shadow: 0 6px 20px rgba(232,123,168,0.25); }
        .persona-card.active[data-persona="james"] { border-color: #4d8bff; box-shadow: 0 6px 20px rgba(77,139,255,0.25); }
        .persona-card.active[data-persona="patricia"] { border-color: #ff99cc; box-shadow: 0 6px 20px rgba(255,153,204,0.25); }
        .persona-portrait { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; margin: 0 auto 8px; display: block; border: 2px solid #333; }
        .persona-card.active .persona-portrait { border-color: inherit; }
        .persona-name { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
        .persona-tag { font-size: 10px; color: #777; }

        .controls-row { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; justify-content: center; flex-wrap: wrap; }
        .toggle-pill {
            display: flex; align-items: center; gap: 6px; padding: 6px 14px;
            background: #1a1a1a; border: 1px solid #333; border-radius: 20px;
            font-size: 12px; color: #999; cursor: pointer; transition: all 0.2s; user-select: none;
        }
        .toggle-pill:hover { border-color: #555; color: #ccc; }
        .toggle-pill.on { border-color: #ff4d4d; color: #ff4d4d; background: rgba(255,77,77,0.08); }
        .toggle-pill input[type="checkbox"] { display: none; }
        .toggle-dot { width: 10px; height: 10px; border-radius: 50%; background: #444; transition: background 0.2s; }
        .toggle-pill.on .toggle-dot { background: #ff4d4d; }

        .chat-container {
            background: #111; border-radius: 16px; padding: 16px;
            height: 420px; overflow-y: auto; margin-bottom: 16px;
            scroll-behavior: smooth; border: 1px solid #1a1a1a;
        }
        .msg-row { display: flex; gap: 10px; margin: 12px 0; align-items: flex-start; }
        .msg-row.user { flex-direction: row-reverse; }
        .msg-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; margin-top: 2px; }
        .msg-bubble { padding: 10px 14px; border-radius: 14px; max-width: 75%; line-height: 1.5; font-size: 14px; word-wrap: break-word; }
        .msg-row.assistant .msg-bubble { background: #1e1e1e; color: #e0e0e0; }
        .msg-row.user .msg-bubble { background: #ff4d4d; color: white; }
        .msg-row.system .msg-bubble { background: transparent; color: #666; text-align: center; width: 100%; font-style: italic; font-size: 13px; }
        .emotion-badge { display: inline-block; background: rgba(255,170,0,0.15); color: #ffaa00; padding: 2px 8px; border-radius: 10px; font-size: 10px; margin-left: 6px; font-weight: 600; }

        .tts-row { display: flex; gap: 6px; margin-top: 6px; }
        .tts-btn {
            background: none; border: 1px solid #333; border-radius: 16px;
            padding: 4px 12px; color: #888; cursor: pointer; font-size: 11px;
            transition: all 0.2s; display: flex; align-items: center; gap: 4px;
        }
        .tts-btn:hover { border-color: #ff4d4d; color: #ff4d4d; }
        .tts-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .tts-btn svg { width: 12px; height: 12px; fill: currentColor; }

        .input-area { display: flex; gap: 8px; }
        .input-area input {
            flex: 1; padding: 12px 18px; border-radius: 25px; border: 1px solid #222;
            background: #141414; color: white; font-size: 14px; outline: none;
        }
        .input-area input:focus { border-color: #ff4d4d; background: #1a1a1a; }
        .send-btn {
            width: 44px; height: 44px; border-radius: 50%; border: none;
            background: #ff4d4d; color: white; cursor: pointer; font-size: 18px;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .send-btn:hover:not(:disabled) { background: #ff3333; transform: scale(1.05); }
        .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .send-btn svg { width: 20px; height: 20px; fill: white; }

        .loading-bar { text-align: center; color: #666; margin: 8px 0; font-size: 12px; display: none; }
        .loading-bar .dots span { animation: blink 1.4s infinite both; }
        .loading-bar .dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-bar .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%,80%,100% { opacity: 0; } 40% { opacity: 1; } }

        .session-info { text-align: center; color: #444; font-size: 11px; margin-top: 10px; }

        .video-container {
            margin: 16px 0; text-align: center; display: none;
            background: #111; border-radius: 16px; padding: 12px; border: 1px solid #222;
        }
        .video-container video { max-width: 100%; max-height: 300px; border-radius: 12px; }
        .video-close { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); border: none; color: white; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-size: 16px; }

        @media (max-width: 500px) {
            .persona-card { width: 72px; padding: 10px 6px; }
            .persona-portrait { width: 40px; height: 40px; }
            .persona-name { font-size: 10px; }
            .persona-tag { display: none; }
            .chat-container { height: 350px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span>&#x1F9E0;</span> Chat DJT <span>Therapy</span></h1>
        </div>

        <div class="persona-selector" id="personaSelector">
            <div class="persona-card" data-persona="trump" onclick="selectPersona('trump')">
                <img class="persona-portrait" src="/server/assets/trump-therapist.png" alt="Dr. Dynamic">
                <div class="persona-name" style="color:#ff4d4d">Dr. Dynamic</div>
                <div class="persona-tag">The Best Therapist</div>
            </div>
            <div class="persona-card" data-persona="sophia" onclick="selectPersona('sophia')">
                <img class="persona-portrait" src="/server/assets/dr-sophia.jpg" alt="Dr. Sophia">
                <div class="persona-name" style="color:#e87ba8">Dr. Sophia</div>
                <div class="persona-tag">Empathetic</div>
            </div>
            <div class="persona-card" data-persona="james" onclick="selectPersona('james')">
                <img class="persona-portrait" src="/server/assets/dr-james.jpg" alt="Dr. James">
                <div class="persona-name" style="color:#4d8bff">Dr. James</div>
                <div class="persona-tag">Analytical</div>
            </div>
            <div class="persona-card" data-persona="patricia" onclick="selectPersona('patricia')">
                <img class="persona-portrait" src="/server/assets/dr-patricia.jpg" alt="Dr. Patricia">
                <div class="persona-name" style="color:#ff99cc">Dr. Patricia</div>
                <div class="persona-tag">Nurturing</div>
            </div>
        </div>

        <div class="controls-row">
            <label class="toggle-pill" id="audioTogglePill" onclick="toggleAudio()">
                <span class="toggle-dot"></span>
                <span id="audioLabel">&#x1F50A; Voice On</span>
            </label>
            <label class="toggle-pill" id="videoTogglePill" onclick="toggleVideo()">
                <span class="toggle-dot"></span>
                <span>&#x1F3AC; Lip-sync</span>
            </label>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="msg-row system"><div class="msg-bubble">Choose a therapist to begin your session.</div></div>
        </div>

        <div class="video-container" id="videoContainer" style="position:relative;">
            <button class="video-close" onclick="closeVideo()">&#x2715;</button>
            <video id="avatarVideo" controls autoplay playsinline></video>
        </div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Type your message..." disabled>
            <button class="send-btn" id="sendBtn" disabled onclick="sendMessage()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
        <div id="loadingIndicator" class="loading-bar">
            <span id="loadingText">Therapist is thinking</span><span class="dots"><span>.</span><span>.</span><span>.</span></span>
        </div>
        <div class="session-info" id="sessionInfo"></div>
    </div>

    <script>
        var currentPersona = null;
        var currentAudio = null;
        var audioEnabled = true;
        var videoEnabled = false;
        var lastTherapyText = '';

        var deviceId = localStorage.getItem('therapy_device_id');
        if (!deviceId) {
            deviceId = 'web_' + Date.now().toString() + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('therapy_device_id', deviceId);
        }

        var personaNames = {
            trump: 'Dr. Dynamic',
            sophia: 'Dr. Sophia',
            james: 'Dr. James',
            patricia: 'Dr. Patricia'
        };

        var personaImages = {
            trump: '/server/assets/trump-therapist.png',
            sophia: '/server/assets/dr-sophia.jpg',
            james: '/server/assets/dr-james.jpg',
            patricia: '/server/assets/dr-patricia.jpg'
        };

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            var pill = document.getElementById('audioTogglePill');
            var label = document.getElementById('audioLabel');
            if (audioEnabled) {
                pill.classList.add('on');
                label.innerHTML = '&#x1F50A; Voice On';
            } else {
                pill.classList.remove('on');
                label.innerHTML = '&#x1F507; Voice Off';
                if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            }
        }
        document.getElementById('audioTogglePill').classList.add('on');

        function toggleVideo() {
            videoEnabled = !videoEnabled;
            var pill = document.getElementById('videoTogglePill');
            if (videoEnabled) { pill.classList.add('on'); } else { pill.classList.remove('on'); }
        }

        function closeVideo() {
            var vc = document.getElementById('videoContainer');
            vc.style.display = 'none';
            var v = document.getElementById('avatarVideo');
            v.pause();
            v.src = '';
        }

        async function selectPersona(personaId) {
            currentPersona = personaId;
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;

            document.querySelectorAll('.persona-card').forEach(function(c) { c.classList.remove('active'); });
            var card = document.querySelector('.persona-card[data-persona="' + personaId + '"]');
            if (card) card.classList.add('active');

            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            closeVideo();

            try {
                var res = await fetch('/api/therapy/greeting', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-device-id': deviceId },
                    body: JSON.stringify({ personaId: personaId })
                });
                var data = await res.json();

                var chat = document.getElementById('chatContainer');
                chat.innerHTML = buildAssistantMsg(data.greeting);

                var info = document.getElementById('sessionInfo');
                if (data.isReturning) {
                    info.textContent = 'Session #' + (data.sessionCount + 1) + ' with ' + personaNames[personaId];
                } else {
                    info.textContent = 'First session with ' + personaNames[personaId];
                }

                document.getElementById('loadingText').textContent = personaNames[personaId] + ' is thinking';
                lastTherapyText = data.greeting;
                if (audioEnabled) autoPlayTTS(data.greeting);
            } catch (err) {
                var chat = document.getElementById('chatContainer');
                chat.innerHTML = buildAssistantMsg("Welcome. Tell me what's on your mind.");
            }
        }

        function buildAssistantMsg(text, tone) {
            var img = personaImages[currentPersona] || '';
            var html = '<div class="msg-row assistant">';
            if (img) html += '<img class="msg-avatar" src="' + img + '" alt="">';
            html += '<div><div class="msg-bubble">' + escapeHtml(text);
            if (tone && tone !== 'neutral') {
                html += ' <span class="emotion-badge">&#x1F3AD; ' + escapeHtml(tone) + '</span>';
            }
            html += '</div>';
            html += '<div class="tts-row">';
            html += '<button class="tts-btn" onclick="replayTTS(this)" data-text="' + escapeAttr(text) + '">';
            html += '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>';
            html += ' Listen</button>';
            html += '</div></div></div>';
            return html;
        }

        async function sendMessage() {
            var input = document.getElementById('messageInput');
            var message = input.value.trim();
            if (!message || !currentPersona) return;

            var chat = document.getElementById('chatContainer');
            chat.innerHTML += '<div class="msg-row user"><div class="msg-bubble">' + escapeHtml(message) + '</div></div>';
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('sendBtn').disabled = true;
            if (currentAudio) { currentAudio.pause(); currentAudio = null; }

            try {
                var res = await fetch('/api/therapy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-device-id': deviceId },
                    body: JSON.stringify({
                        name: 'Friend',
                        problem: message,
                        seriousness: '5',
                        voice: currentPersona,
                    })
                });

                if (res.status === 403) {
                    chat.innerHTML += '<div class="msg-row system"><div class="msg-bubble">Session limit reached. Subscribe for more sessions!</div></div>';
                    return;
                }

                var data = await res.json();
                var therapyText = data.therapy || data.reply || '';
                chat.innerHTML += buildAssistantMsg(therapyText, data.detectedTone);
                chat.scrollTop = chat.scrollHeight;
                lastTherapyText = therapyText;

                if (videoEnabled && therapyText) {
                    document.getElementById('loadingText').textContent = 'Generating lip-sync video';
                    try {
                        var lipRes = await fetch('/api/therapy/lip-sync', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'x-device-id': deviceId },
                            body: JSON.stringify({ text: therapyText.slice(0, 500), personaId: currentPersona })
                        });
                        var lipData = await lipRes.json();
                        if (lipData.videoUrl) {
                            var vc = document.getElementById('videoContainer');
                            var vid = document.getElementById('avatarVideo');
                            vid.src = lipData.videoUrl;
                            vc.style.display = 'block';
                            vid.play().catch(function() {});
                        } else if (audioEnabled) {
                            autoPlayTTS(therapyText);
                        }
                    } catch (lipErr) {
                        if (audioEnabled) autoPlayTTS(therapyText);
                    }
                } else if (audioEnabled && therapyText) {
                    autoPlayTTS(therapyText);
                }

            } catch (error) {
                chat.innerHTML += '<div class="msg-row system"><div class="msg-bubble">Connection error. Please try again.</div></div>';
            } finally {
                document.getElementById('loadingIndicator').style.display = 'none';
                document.getElementById('loadingText').textContent = personaNames[currentPersona] + ' is thinking';
                document.getElementById('sendBtn').disabled = false;
                chat.scrollTop = chat.scrollHeight;
            }
        }

        async function autoPlayTTS(text) {
            if (!text || !audioEnabled) return;
            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            try {
                var response = await fetch('/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text.slice(0, 500), voice: currentPersona, mood: 'CALM', speechCategory: 'CASUAL_TALK' })
                });
                if (!response.ok) return;
                var blob = await response.blob();
                var url = URL.createObjectURL(blob);
                currentAudio = new Audio(url);
                currentAudio.play().catch(function() {});
                currentAudio.onended = function() { currentAudio = null; };
            } catch (err) {}
        }

        async function replayTTS(btn) {
            var text = btn.getAttribute('data-text');
            if (!text) return;
            if (currentAudio) { currentAudio.pause(); currentAudio = null; btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg> Listen'; return; }
            btn.disabled = true;
            btn.textContent = 'Loading...';
            try {
                var response = await fetch('/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text.slice(0, 500), voice: currentPersona, mood: 'CALM', speechCategory: 'CASUAL_TALK' })
                });
                if (!response.ok) throw new Error();
                var blob = await response.blob();
                var url = URL.createObjectURL(blob);
                currentAudio = new Audio(url);
                currentAudio.play().catch(function() {});
                btn.disabled = false;
                btn.innerHTML = '&#x23F9; Stop';
                currentAudio.onended = function() {
                    currentAudio = null;
                    btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg> Listen';
                };
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg> Listen';
            }
        }

        document.getElementById('messageInput').onkeypress = function(e) {
            if (e.key === 'Enter') sendMessage();
        };

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeAttr(text) {
            return text.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }
    </script>

    <div style="text-align:center;padding:20px 16px 30px;max-width:500px;margin:0 auto;">
        <p style="font-size:10px;color:rgba(255,255,255,0.15);line-height:1.5;">For entertainment purposes only. Not a substitute for professional medical advice.</p>
    </div>
</body>
</html>
