                generic: function(g) { return "You have THREE betting wishes today. Use them wisely, for the Genie does not offer refunds!"; }
            },
            mansa: {
                nfl: function(g) { return "In my empire, we would have BOUGHT both teams. But since you must choose — pick the richer franchise."; },
                nba: function(g) { return "Basketball is like trade routes — control the tempo, control the game. Take the team that controls pace."; },
                ufc: function(g) { return "A true king never fights himself. But he bets on the one with the most to prove."; },
                mlb: function(g) { return "Patience, like gold mining, is key. Take the team with the better bullpen. Wars are won in the late innings."; },
                soccer: function(g) { return "Football is the world's game, and the world was once MY game. Take the home side. Home is empire."; },
                golf: function(g) { return "Augusta — a kingdom of green. The player who COMMANDS the course like an emperor commands his realm. Patience and GOLD win at the Masters."; },
                boxing: function(g) { return "In my empire, the greatest warriors earned GOLD. The fighter who controls the ring controls the kingdom. Patience conquers power."; },
                nascar: function(g) { return "Speed is fleeting — strategy is EMPIRE. The team with the wisest pit crew builds a dynasty, not just a race win."; },
                ncaab: function(g) { return "Young warriors proving themselves in the arena! Like selecting generals for my army. Take the team with the most disciplined leader."; },
                generic: function(g) { return "I once collapsed an economy with generosity. Don't collapse YOUR economy with bad bets. Be strategic."; }
            }
        };

        var affiliatePrograms = {
            draftkings: { name: 'DraftKings', url: 'https://www.draftkings.com', logo: '&#x1F7E2;' },
            fanduel: { name: 'FanDuel', url: 'https://www.fanduel.com', logo: '&#x1F535;' },
            bet365: { name: 'Bet365', url: 'https://www.bet365.com', logo: '&#x1F537;' },
            stake: { name: 'Stake', url: 'https://www.stake.com', logo: '&#x1F3B0;' }
        };

        var upcomingGames = [];
        var selectedP1 = 'trump';
        var selectedP2 = 'buffett';
        var debateVoted = false;
        var h2hData = { wins: 0, losses: 0, total: 0 };

        function getRecommendedBook() { return 'draftkings'; }

        function getPersonaPick(personaId, game) {
            var leagueKey = (game.league || '').toLowerCase();
            var picks = SPORT_PICKS[personaId];
            if (!picks) return "No comment.";
            var fn = picks[leagueKey] || picks.generic;
            return fn ? fn(game) : "No comment.";
        }

        function generateTrashTalk(p1, p2) {
            var lines = {
                trump: ["I've won more than " + PERSONAS[p2].name + " has ever DREAMED of winning!", "Nobody knows sports like me. NOBODY. Ask anyone.", PERSONAS[p2].name + "? Nice person, but TERRIBLE at picks. Terrible."],
                buffett: ["The odds favor patience, not " + PERSONAS[p2].name + "'s impulsiveness.", "I've been investing longer than " + PERSONAS[p2].name + " has been relevant.", "Value is found where others panic. " + PERSONAS[p2].name + " panics a lot."],
                jordan: ["I took " + PERSONAS[p2].name + "'s pick PERSONALLY.", "Six rings say I know winning better than " + PERSONAS[p2].name + ".", PERSONAS[p2].name + " couldn't guard me and can't out-pick me."],
                bernie: ["Man, " + PERSONAS[p2].name + " don't know NOTHIN' bout sports! I ain't scared!", "Look here, " + PERSONAS[p2].name + " — I been callin' games since you was in DIAPERS!", PERSONAS[p2].name + "?! Sheeeeit, my GRANDMAMA picks better than that!"],
                ruckus: ["I don't trust " + PERSONAS[p2].name + "'s picks OR their judgment, I tell you what!", PERSONAS[p2].name + " couldn't pick a winner if they was the ONLY one runnin'!", "Lemme tell you somethin' — " + PERSONAS[p2].name + " is WRONG. Always has been!"],
                genie: ["In 10,000 years, I've never seen picks as bad as " + PERSONAS[p2].name + "'s!", "The lamp reveals all — and it reveals " + PERSONAS[p2].name + " is WRONG!", "I grant wishes, not miracles. " + PERSONAS[p2].name + " would need a miracle."],
                grandma: ["Oh, " + PERSONAS[p2].name + " is nice, but my picks are better, dear.", "Your grandfather always said — don't listen to " + PERSONAS[p2].name + ".", "That's nice, " + PERSONAS[p2].name + ". But Grandma knows best."]
            };
            var personaLines = lines[p1] || ["I know more about sports than " + PERSONAS[p2].name + " ever will."];
            return personaLines[Math.floor(Math.random() * personaLines.length)];
        }

        function fetchGames() {
            fetch('/api/sports/upcoming')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.games && data.games.length > 0) {
                        upcomingGames = data.games;
                    } else {
                        upcomingGames = getDefaultGames();
                    }
                    render();
                })
                .catch(function() {
                    upcomingGames = getDefaultGames();
                    render();
                });
        }

        function getDefaultGames() {
            var now = new Date();
            var tonight = new Date(now); tonight.setHours(20, 15, 0, 0);
            var tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1); tomorrow.setHours(19, 30, 0, 0);
            var saturday = new Date(now); saturday.setDate(now.getDate() + (6 - now.getDay() + 7) % 7); saturday.setHours(22, 0, 0, 0);
            var sunday = new Date(now); sunday.setDate(now.getDate() + (7 - now.getDay()) % 7 || 7); sunday.setHours(16, 5, 0, 0);
            var thursday = new Date(now); thursday.setDate(now.getDate() + (4 - now.getDay() + 7) % 7); thursday.setHours(15, 0, 0, 0);
            var friday = new Date(now); friday.setDate(now.getDate() + (5 - now.getDay() + 7) % 7); friday.setHours(18, 0, 0, 0);

            return [
                { id: 1, league: 'NCAAB', game: 'March Madness - Sweet 16', time: formatGameTime(thursday), odds: 'Check brackets for latest matchups' },
                { id: 2, league: 'NCAAB', game: 'March Madness - Elite 8', time: formatGameTime(saturday), odds: 'Seeds TBD | Upset watch!' },
                { id: 3, league: 'GOLF', game: 'The Masters - Augusta National', time: 'Thu Apr 10 - Sun Apr 13', odds: 'Scheffler +600 | Rahm +800 | McIlroy +1200' },
                { id: 4, league: 'NBA', game: 'Lakers vs Celtics', time: formatGameTime(tomorrow), odds: 'Lakers +4 | O/U 225.5' },
                { id: 5, league: 'BOXING', game: 'Gervonta Davis vs Shakur Stevenson', time: 'Sat Mar 29 | Brooklyn', odds: 'Davis -150 | Stevenson +130 | Lightweight' },
                { id: 6, league: 'NASCAR', game: 'NASCAR Cup Series - COTA', time: formatGameTime(sunday), odds: 'Larson +400 | Elliott +600 | Reddick +800' },
                { id: 7, league: 'UFC', game: 'UFC Fight Night', time: formatGameTime(saturday), odds: 'Check card for latest odds' },
                { id: 8, league: 'NHL', game: 'Rangers vs Bruins', time: formatGameTime(friday), odds: 'Rangers -110 | Bruins -110 | O/U 5.5' },
                { id: 9, league: 'F1', game: 'F1 Grand Prix', time: formatGameTime(sunday), odds: 'Verstappen +150 | Norris +300 | Leclerc +500' },
                { id: 10, league: 'MLB', game: 'Spring Training - Yankees vs Dodgers', time: formatGameTime(saturday), odds: 'Exhibition game | Season starts Mar 27' }
            ];
        }

        function formatGameTime(d) {
            var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            var h = d.getHours(); var m = d.getMinutes();
            var ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            return days[d.getDay()] + ' ' + h + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
        }

        function speakPersona(personaId, text) {
            var btn = document.querySelector('[data-speak="' + personaId + '"]');
            if (btn) btn.textContent = '...';
            fetch('/api/persona-speak', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text.slice(0, 300), personaId: personaId })
            })
            .then(function(r) { return r.blob(); })
            .then(function(blob) {
                var url = URL.createObjectURL(blob);
                var audio = new Audio(url);
                audio.play();
                audio.onended = function() { URL.revokeObjectURL(url); };
                if (btn) btn.textContent = '\u{1F50A}';
            })
            .catch(function() {
                if (btn) btn.textContent = '\u{1F50A}';
            });
        }

        function render() {
            var bookie = getRecommendedBook();
            var prog = affiliatePrograms[bookie];
            var p1 = PERSONAS[selectedP1];
            var p2 = PERSONAS[selectedP2];

            var featuredGame = upcomingGames[0] || { game: 'TBD', league: 'TBD', time: 'Soon' };
            var pick1 = getPersonaPick(selectedP1, featuredGame);
            var pick2 = getPersonaPick(selectedP2, featuredGame);
            var talk1 = generateTrashTalk(selectedP1, selectedP2);
            var talk2 = generateTrashTalk(selectedP2, selectedP1);

            var html = '';
            html += '<div class="sports-header">';
            html += '<h1>TRUMP\'S SPORTS BOOK</h1>';
            html += '<div class="subhead">AI Persona Picks &amp; Debates</div>';
            html += '<div class="live-badge">LIVE PICKS</div>';
            html += '</div>';

            html += '<div class="persona-selector">';
            html += '<div class="section-label">PICK YOUR DEBATERS</div>';
            html += '<div class="persona-row">';
            Object.keys(PERSONAS).forEach(function(id) {
                var p = PERSONAS[id];
                var sel1 = selectedP1 === id;
                var sel2 = selectedP2 === id;
                var borderColor = sel1 ? p1.color : (sel2 ? p2.color : '#333');
                html += '<div class="persona-chip' + (sel1 || sel2 ? ' selected' : '') + '" style="border-color:' + borderColor + ';" onclick="selectPersona(\'' + id + '\')">';
                html += '<img src="' + p.imageUrl + '" style="border-color:' + p.color + ';" onerror="this.style.display=\'none\'">';
                html += '<div class="chip-name" style="color:' + (sel1 || sel2 ? p.color : '#aaa') + ';">' + p.name + '</div>';
                html += '</div>';
            });
            html += '</div></div>';

            html += '<div class="featured-book" onclick="trackClick(\'' + bookie + '\')">';
            html += '<div class="book-logo">' + prog.logo + '</div>';
            html += '<div class="book-info">';
            html += '<h3>BEST OFFER: ' + prog.name + '</h3>';
            html += '<button class="bet-now-btn">BET NOW</button>';
            html += '</div></div>';

            html += '<div class="debate-arena">';
            html += '<div class="section-label">TODAY\'S DEBATE: ' + featuredGame.game + '</div>';
            html += '<div class="debate-grid">';

            html += '<div class="debate-card" style="border-color:' + p1.color + ';">';
            html += '<img src="' + p1.imageUrl + '" style="border-color:' + p1.color + ';" onerror="this.style.display=\'none\'">';
            html += '<div class="d-name" style="color:' + p1.color + ';">' + p1.name + '</div>';
            html += '<div class="d-pick">' + pick1 + '</div>';
            html += '<button class="listen-btn" data-speak="' + selectedP1 + '" onclick="event.stopPropagation();speakPersona(\'' + selectedP1 + '\',\'' + pick1.replace(/'/g, "\\'") + '\')" title="Listen">\u{1F50A}</button>';
            html += '<button class="vote-btn" style="background:' + p1.color + ';"' + (debateVoted ? ' disabled' : '') + ' onclick="castVote(\'' + selectedP1 + '\',\'' + selectedP2 + '\')">VOTE ' + p1.name.toUpperCase() + '</button>';
            html += '</div>';

            html += '<div class="vs-badge">VS</div>';

            html += '<div class="debate-card" style="border-color:' + p2.color + ';">';
            html += '<img src="' + p2.imageUrl + '" style="border-color:' + p2.color + ';" onerror="this.style.display=\'none\'">';
            html += '<div class="d-name" style="color:' + p2.color + ';">' + p2.name + '</div>';
            html += '<div class="d-pick">' + pick2 + '</div>';
            html += '<button class="listen-btn" data-speak="' + selectedP2 + '" onclick="event.stopPropagation();speakPersona(\'' + selectedP2 + '\',\'' + pick2.replace(/'/g, "\\'") + '\')" title="Listen">\u{1F50A}</button>';
            html += '<button class="vote-btn" style="background:' + p2.color + ';"' + (debateVoted ? ' disabled' : '') + ' onclick="castVote(\'' + selectedP2 + '\',\'' + selectedP1 + '\')">VOTE ' + p2.name.toUpperCase() + '</button>';
            html += '</div>';
            html += '</div>';

            if (h2hData.total > 0) {
                html += '<div class="h2h-bar">HEAD-TO-HEAD: <span class="record" style="color:' + p1.color + ';">' + p1.name + ' ' + h2hData.wins + '</span> - <span class="record" style="color:' + p2.color + ';">' + h2hData.losses + ' ' + p2.name + '</span></div>';
            }

            if (debateVoted) {
                html += '<div class="trash-talk">';
                html += '<h4>TRASH TALK</h4>';
                html += '<div class="talk-line" style="color:' + p1.color + ';">"' + talk1 + '"</div>';
                html += '<div class="talk-line" style="color:' + p2.color + ';">"' + talk2 + '"</div>';
                html += '</div>';
            }
            html += '</div>';

            html += '<div class="games-section">';
            html += '<div class="section-label">UPCOMING GAMES</div>';
            html += '<div class="games-list">';
            upcomingGames.forEach(function(game) {
                html += '<div class="game-card">';
                html += '<div class="game-top"><span class="game-league">' + game.league + '</span><span class="game-time">' + game.time + '</span></div>';
                html += '<div class="game-matchup">' + game.game + '</div>';
                if (game.odds) html += '<div class="game-odds">' + game.odds + '</div>';

                html += '<div class="persona-picks">';
                [selectedP1, selectedP2].forEach(function(pid) {
                    var pp = PERSONAS[pid];
                    var pick = getPersonaPick(pid, game);
                    var escapedPick = pick.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    html += '<div class="pick-line">';
                    html += '<img src="' + pp.imageUrl + '" onerror="this.style.display=\'none\'">';
                    html += ' <span style="color:' + pp.color + ';font-weight:bold;">' + pp.name + ':</span> ' + pick;
                    html += ' <button data-speak="' + pid + '-' + game.id + '" onclick="event.stopPropagation();speakPersona(\'' + pid + '\',\'' + escapedPick + '\')" style="background:none;border:1px solid #555;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:10px;color:#ccc;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;margin-left:6px;vertical-align:middle;" title="Listen">\u{1F50A}</button>';
                    html += '</div>';
                });
                html += '</div>';

                html += '<button class="game-bet-btn" onclick="trackClick(\'' + bookie + '\')">BET ON ' + prog.name.toUpperCase() + '</button>';
                html += '</div>';
            });
            html += '</div></div>';

            html += '<div class="cross-promo">';
            html += '<p style="color:#888;margin-bottom:8px;">Want more debates?</p>';
            html += '<a href="/financial-faceoff">Try Financial Faceoff &#x2192;</a>';
            html += '</div>';

            html += '<div class="disclaimer">';
            html += '<p>21+ only. Gamble responsibly. If you have a problem, call 1-800-GAMBLER.</p>';
            html += '<p>Affiliate links: We may earn commissions. Not real betting advice.</p>';
            html += '</div>';

            document.getElementById('app').innerHTML = html;
        }

        function selectPersona(id) {
            if (id === selectedP1) return;
            if (id === selectedP2) {
                selectedP2 = selectedP1;
                selectedP1 = id;
            } else {
                selectedP2 = id;
            }
            debateVoted = false;
            loadH2H();
            render();
            showToast('Debate updated!');
        }

        function castVote(winnerId, loserId) {
            if (debateVoted) return;
            debateVoted = true;

            fetch('/api/faceoff/vote', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ debateId: 'sports_' + winnerId + '_' + loserId + '_' + Date.now(), asset: 'sports', persona1: winnerId, persona2: loserId, votedFor: winnerId })
            }).catch(function() {});

            fetch('/api/track-viral', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ event: 'sports_vote', data: { winner: winnerId, loser: loserId } })
            }).catch(function() {});

            h2hData.wins += (winnerId === selectedP1 ? 1 : 0);
            h2hData.losses += (winnerId === selectedP2 ? 1 : 0);
            h2hData.total += 1;

            render();
            showToast('Voted for ' + PERSONAS[winnerId].name + '!');

            setTimeout(function() {
                var p = PERSONAS[winnerId];
                var text = 'I agree with ' + p.fullName + ' on ' + (upcomingGames[0] ? upcomingGames[0].game : 'the game') + '! Who do YOU agree with? Vote at thearena.rip';
                if (navigator.share) {
                    navigator.share({ text: text }).catch(function() {});
                }
            }, 1500);
        }

        function loadH2H() {
            var key = 'sports_h2h_' + [selectedP1, selectedP2].sort().join('_');
            try {
                var stored = localStorage.getItem(key);
                if (stored) {
                    h2hData = JSON.parse(stored);
                } else {
                    h2hData = { wins: 0, losses: 0, total: 0 };
                }
            } catch(e) {
                h2hData = { wins: 0, losses: 0, total: 0 };
            }
        }

        function saveH2H() {
            var key = 'sports_h2h_' + [selectedP1, selectedP2].sort().join('_');
            try { localStorage.setItem(key, JSON.stringify(h2hData)); } catch(e) {}
        }

        function trackClick(programId) {
            var prog = affiliatePrograms[programId];
            if (prog) {
                window.open(prog.url, '_blank');
                showToast('Redirecting to ' + prog.name + '...');
                fetch('/api/track-viral', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ event: 'sportsbook_click', data: { program: programId } })
                }).catch(function() {});
            }
        }

        function showToast(msg) {
            var existing = document.querySelector('.toast');
            if (existing) existing.remove();
            var t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(function() { t.remove(); }, 2500);
        }

        loadH2H();
        fetchGames();
    </script>
</body>
</html>
